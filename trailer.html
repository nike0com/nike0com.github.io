<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  // Shows one YouTube video full screen: trailer.html?v=VIDEO_ID
  // Used by a TV app that cannot embed YouTube itself (it has no web address).
  var m = /[?&]v=([A-Za-z0-9_-]{6,20})/.exec(location.search);
  if (m) {
    var f = document.createElement('iframe');
    f.allow = 'autoplay; fullscreen; encrypted-media';
    f.src = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    document.body.appendChild(f);
  }
</script>
</body>
</html>
